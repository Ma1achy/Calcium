name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # A04 §6 — every push. Under two minutes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make enforce      # A03 · ~5s · fails first, deliberately
      - run: make check
      - run: make audit
      - run: make test

  # Heavy stages: main and tags only. Private repos have a monthly budget and
  # golden frames at 16 configurations plus PTY e2e is where it goes.
  # A04 §6 — the merge gate. A pull request is not "every push": it is the one
  # moment where this tier changes a decision, and conditioning it on the ref
  # alone meant it only ever ran after the merge, on the branch nobody was
  # gating. Five consecutive red merges to `main` came through that gap.
  full:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make golden
      - run: make e2e
        env:
          TERM: xterm-256color

  # Degradation is not tested by hoping someone's laptop is misconfigured.
  degraded:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: fast
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { term: dumb,           lang: C }
          - { term: xterm,          lang: C }
          - { term: xterm-256color, lang: en_GB.UTF-8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: make install
      - run: make test
        env:
          TERM: ${{ matrix.term }}
          LANG: ${{ matrix.lang }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [full, degraded]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - run: make install
      - run: npm run build
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/**
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
