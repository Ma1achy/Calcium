name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # A04 §6 — every push. Under two minutes.
  fast:
    runs-on: ubuntu-latest
    steps:
      # **v5 for both, and the reason is the runtime rather than the features.**
      # v4 targets Node 20, which the runner now force-migrates to Node 24 and
      # annotates on every job — six orange warnings on a green run, which is
      # how a real deprecation gets read as noise. v5 is the major that moved to
      # node24 (minimum runner v2.327.1; the hosted runners are long past it).
      #
      # **Not the latest major, deliberately.** checkout is at v7 and setup-node
      # at v7 today. Everything between v5 and v7 is a change this workflow does
      # not use — checkout v6 persists credentials to a separate file and v7
      # blocks fork-PR checkout for `pull_request_target` and `workflow_run`,
      # neither of which appears in `on:`; setup-node v6 narrows automatic
      # caching to npm and v7 drops the dummy `NODE_AUTH_TOKEN` export. Moving
      # one major for one stated reason is a change that can be checked; moving
      # three bundles four unexamined ones into a CI repair.
      #
      # **The one behaviour change v5 does carry was checked**: setup-node v5
      # caches automatically when `package.json` declares `packageManager`. This
      # repository declares none, and every step below sets `cache: npm`
      # explicitly, so the arm cannot fire here either way.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make enforce      # A03 · ~5s · fails first, deliberately
      - run: make check        # includes both examples' own `check` scripts (F150)

      # **`instruments` was in `make all` and in no CI job** (F154). The
      # Makefile's own header says *CI runs these targets, not equivalents*, and
      # the `instruments` recipe carries group 9's whole remedy in a comment —
      # *in here rather than run by hand* — which was true of the local gate and
      # not of the enforced one. Same shape as F60 one job down: a gate that is
      # not wired is not a gate. 16 instruments, 113 rows, about ten seconds.
      #
      # **And two of those fixtures read `docs/catalogue/`, which is gitignored.**
      # This job failed on it from 2026-08-23 until the target below existed —
      # green locally on a directory a clean clone never has. The Makefile row
      # carries the account; `catalogue` is a prerequisite of `instruments` and `test`.
      - run: make instruments

      - run: make audit

      # **Before `make test`, because it is what a red scan row wants read
      # first.** Prints this runner's cost per source-scan pass beside the
      # figures `budget.ts` records and their ratio. Never fails.
      #
      # The recorded numbers are from an idle developer machine, and this repo
      # measured on the same day that the gate is its own load: two C12/C14 fuzz
      # rows timed out at 5 s under concurrent PTYs and passed in 7.5 s alone. A
      # budget measured on a quiet machine is the one that fails first
      # elsewhere, so the ratio is the sentence someone reading a foreign
      # failure needs — and it has to be in the run's own output, not in a
      # source comment they will not open while a job is red.
      - run: make regime

      - run: make test

  # Heavy stages: main and tags only. Private repos have a monthly budget and
  # golden frames at 16 configurations plus PTY e2e is where it goes.
  # A04 §6 — the merge gate. A pull request is not "every push": it is the one
  # moment where this tier changes a decision, and conditioning it on the ref
  # alone meant it only ever ran after the merge, on the branch nobody was
  # gating. Five consecutive red merges to `main` came through that gap.
  full:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: make install
      # **Two tier-5 rows drive a real emulator under Xvfb** (C02 T5.7 on kitty,
      # C16 T5.9 on xterm; F808, F810). Without these they skip by name — the
      # reason in the row's title — which is not a pass, and not the gate either.
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xdotool xterm kitty
      - run: make golden
      - run: make e2e
        env:
          TERM: xterm-256color

  # R01 commitment 10, and it was not held. **This job did not exist**, so `make
  # proof` — the one gate that proves Calcium is a package rather than a
  # workspace — ran only when someone remembered.
  #
  # It was **red from PR #20 through PR #21**, two merged steps, because two of
  # the app's test files import `../../../dist/…` (F36 and F37's missing exports)
  # and that path is relative to the checkout. The gate copies the example into a
  # tree that has never seen this repository, where it resolves to nothing, so
  # both files failed at import before a single assertion ran. **A gate that is
  # not wired is not a gate**, and the cost was two merges past a broken one.
  # FINDINGS F60.
  #
  # On pull requests as well as main, for the reason the `full` job already
  # carries: conditioning a merge gate on the ref alone means it only ever runs
  # after the merge, on the branch nobody was gating.
  proof:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: make install
      # Packs the real tarball, installs it into a tree that has never seen this
      # repository, and runs **both** examples' suites against it: `docker-tui`
      # and the README's `minimal`. It is also the only place CI runs either
      # example's tests at all.
      - run: make proof

      # **The skip, recorded rather than silent** — R01 commitment 10's second
      # half, which is the half that is easy to lose.
      #
      # This runner has no docker daemon. Every row above ran against
      # `test/corpus/`, twelve captures taken by hand from a live daemon, which
      # is what R01 §7's corpus is for — verified: the app's 235 rows pass with
      # `docker` removed from `PATH` entirely.
      #
      # What CI therefore does **not** exercise: any verb against a real far
      # side, the fixture containers, and every frame-read. Those are
      # `examples/docker/VERIFYING.md`'s job and they run in the `docker-tui`
      # devcontainer.
      - name: record what this job did not run
        run: |
          echo "::notice title=real-docker::No daemon on this runner."
          echo "::notice title=real-docker::The app's suite ran against test/corpus/ (R01 §7)."
          echo "::notice title=real-docker::Not exercised: live verbs, make fixtures, every frame-read."

  # Degradation is not tested by hoping someone's laptop is misconfigured.
  degraded:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: fast
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { term: dumb,           lang: C }
          - { term: xterm,          lang: C }
          - { term: xterm-256color, lang: en_GB.UTF-8 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: make install
      - run: make test
        env:
          TERM: ${{ matrix.term }}
          LANG: ${{ matrix.lang }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    # **`proof` is in this list and was not**, which was the wrong order in the
    # sharpest possible way: the gate that proves the tarball installs and works
    # did not gate publishing the tarball. It was also never run automatically
    # (see the job above), so `publish` was reachable on a tag with the
    # package-is-a-package claim last checked by hand at an unknown date.
    needs: [full, degraded, proof]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - run: make install
      - run: npm run build
      # v1 → v3 for the runtime, as above. **v2 changed what this produces**: a
      # `subject-path` matching several files now yields one attestation
      # referencing each subject rather than one per artefact, which is the
      # behaviour the current documentation describes and the better of the two
      # for `dist/**`. Recorded because this job has never run — it is gated on
      # a version tag, so nothing here is exercised by CI, and the bump is
      # unverified in exactly the way the comment above already says publishing
      # is.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/**
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
