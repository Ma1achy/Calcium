<!doctype html>
<title>dtui-web</title>
<h1>dtui-web</h1>
<p>A fixture container for docker-tui. Bind-mounted from <code>examples/docker/fixtures/</code>.</p>
<p>Its point is not to be looked at in a browser: it is a bind mount that <code>/inspect</code>
and <code>/drift</code> can show, alongside a published port and an environment variable the
image does not set.</p>
